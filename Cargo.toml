[package]
name = "neowutran-hudsucker-fork"
version = "0.25.4"
edition = "2024"
description = "MITM HTTP/S proxy"
documentation = "https://docs.rs/hudsucker"
readme = "README.md"
homepage = "https://github.com/omjadas/hudsucker"
repository = "https://github.com/omjadas/hudsucker"
license = "MIT OR Apache-2.0"
keywords = ["http", "proxy"]
categories = ["network-programming"]
exclude = [".github/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
async-compression = { version = "0.4", features = ["tokio", "brotli", "gzip", "zlib", "zstd"], optional = true }
bstr = "1.0"
futures = "0.3"
http = "1.1"
http-body-util = "0.1"
hyper = "1.7"
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "tls12", "native-tokio", "http1", "rustls-platform-verifier"], optional = true }
hyper-tls = { version = "0.6", optional = true }
hyper-tungstenite = "0.30"
hyper-util = { version="0.1", features = ["client-legacy", "server", "http1"] }
moka = { version = "0.12", features = ["future"], optional = true }
openssl = { version = "0.10", optional = true }
rand = { version = "0.10", optional = true }
rcgen = { version = "0.14", features = ["x509-parser"], optional = true }
rustls = { version = "0.23", features = ["ring", "std", "tls12"], default-features = false }
thiserror = "2.0"
time = { version = "0.3", optional = true }
tokio = { version = "1.24", features = ["macros", "rt"] }
tokio-graceful = "0.2"
tokio-native-tls = { version = "0.3", optional = true }
tokio-rustls = { version = "0.26", features = ["logging", "tls12", "ring"], default-features=false }
tokio-tungstenite = "0.30"
tokio-util = { version = "0.7", features = ["io"], optional = true }
tracing = { version = "0.1", features = ["log"] }

[dev-dependencies]
async-http-proxy = { version = "1.2", features = ["runtime-tokio"] }
criterion = { version = "0.8", features = ["async_tokio"] }
reqwest = "0.13"
rustls-native-certs = "0.8"
rustls-pemfile = "2.0"
tokio = { version = "1.24", features = ["full"] }
tokio-native-tls = "0.3"
tracing-subscriber = "0.3"
x509-parser = "0.18"

[features]
decoder = ["dep:async-compression", "dep:tokio-util", "tokio/io-util"]
default = ["decoder", "rcgen-ca", "rustls-client"]
full = ["decoder", "http2", "native-tls-client", "openssl-ca", "rcgen-ca", "rustls-client"]
http2 = ["hyper-util/http2", "hyper-rustls?/http2"]
native-tls-client = ["dep:hyper-tls", "dep:tokio-native-tls", "tokio-tungstenite/native-tls"]
openssl-ca = ["dep:openssl", "dep:moka"]
rcgen-ca = ["dep:rcgen", "dep:moka", "dep:time", "dep:rand"]
rustls-client = ["dep:hyper-rustls", "tokio-tungstenite/rustls-tls-native-roots"]

[[example]]
name = "log"
required-features = ["rcgen-ca", "rustls-client"]

[[example]]
name = "noop"
required-features = ["rcgen-ca", "rustls-client"]

[[example]]
name = "openssl"
required-features = ["openssl-ca", "rustls-client"]

[[test]]
name = "openssl_ca"
required-features = ["decoder", "openssl-ca", "native-tls-client", "rustls-client"]

[[test]]
name = "rcgen_ca"
required-features = ["decoder", "rcgen-ca", "native-tls-client", "rustls-client"]

[[test]]
name = "websocket"
required-features = ["decoder", "rcgen-ca", "native-tls-client", "rustls-client"]

[[bench]]
name = "certificate_authorities"
harness = false
required-features = ["openssl-ca", "rcgen-ca"]

[[bench]]
name = "decoder"
harness = false
required-features = ["decoder"]

[[bench]]
name = "proxy"
harness = false
required-features = ["rcgen-ca", "rustls-client"]

[profile.bench]
lto = true
debug = true
codegen-units = 1
